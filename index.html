<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#02060a;--panel:rgba(5,11,16,.78);--line:rgba(115,190,215,.22);--cyan:#9fe8ff;--text:#e7f7fb;--muted:#78919b;--gold:#d8b36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 28%,#10232b 0,#071016 34%,#02060a 72%);position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(170,220,230,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(170,220,230,.05) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
button,input,select{font:inherit}button{touch-action:manipulation;-webkit-appearance:none;appearance:none}
.wrap{width:min(1080px,100%);min-height:100dvh;margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:0 4px}.brand{font-size:clamp(18px,4vw,27px);font-weight:500;letter-spacing:.34em}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px;letter-spacing:.2em}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:#53666d;box-shadow:0 0 8px #53666d}
.panel{background:linear-gradient(145deg,rgba(13,25,31,.82),rgba(3,9,13,.72));border:1px solid var(--line);box-shadow:inset 0 1px rgba(255,255,255,.035),0 18px 55px rgba(0,0,0,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.core{height:min(48vh,470px);min-height:280px;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:4px}.core:before,.core:after{content:"";position:absolute;inset:16px;border:1px solid rgba(150,210,225,.08);pointer-events:none}.core:after{inset:auto 28px 18px;height:1px;background:linear-gradient(90deg,transparent,rgba(150,210,225,.22),transparent)}
.core-stage{width:min(410px,72vw);aspect-ratio:1;position:relative;display:grid;place-items:center}.ring{position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(145,215,232,.22);box-shadow:0 0 50px rgba(80,170,195,.07);animation:spin 28s linear infinite}.ring:before{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(216,179,106,.22);border-left-color:transparent;border-right-color:transparent;animation:spin 16s linear reverse infinite}.ring:after{content:"";position:absolute;inset:25%;border-radius:50%;border:1px dashed rgba(145,215,232,.25);animation:spin 10s linear infinite}.ring2{position:absolute;inset:31%;border-radius:50%;border:1px solid rgba(160,225,240,.3);box-shadow:0 0 28px rgba(100,200,220,.12);animation:pulse 4s ease-in-out infinite}.orb{width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 3%,#d9f9ff 9%,#82d9eb 25%,#3b8c9c 43%,rgba(35,83,94,.25) 65%,transparent 72%);box-shadow:0 0 18px rgba(180,240,250,.85),0 0 70px rgba(82,190,215,.3);animation:pulse 3s ease-in-out infinite}.scan{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 82%,rgba(170,230,240,.16) 87%,transparent 91%);animation:spin 7s linear infinite}.ticks{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(160,215,225,.22) 0 1deg,transparent 1deg 12deg);mask-image:radial-gradient(circle,transparent 67%,#000 68%,#000 70%,transparent 71%)}
.core-label{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.32em;color:#607982}.corner{position:absolute;width:24px;height:24px;border-color:rgba(160,220,235,.28);border-style:solid}.c1{top:14px;left:14px;border-width:1px 0 0 1px}.c2{top:14px;right:14px;border-width:1px 1px 0 0}.c3{bottom:14px;left:14px;border-width:0 0 1px 1px}.c4{bottom:14px;right:14px;border-width:0 1px 1px 0}
.chat{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:120px;max-height:31vh;overflow:auto;border-radius:4px}.line{display:flex;gap:13px}.tag{flex:0 0 48px;color:#7eb4c1;font-size:9px;letter-spacing:.18em;padding-top:4px}.msg{line-height:1.55;font-size:14px;white-space:pre-wrap;word-break:break-word;color:#dcecef}.user .tag{color:var(--gold)}
.inputbar{display:flex;gap:8px;padding:8px;border-radius:4px}.inputbar input{flex:1;min-width:0;background:rgba(1,7,10,.8);border:1px solid var(--line);border-radius:2px;color:var(--text);padding:14px;font-size:16px;outline:none}.inputbar input:focus{border-color:rgba(160,225,240,.55);box-shadow:0 0 0 2px rgba(130,205,220,.06)}
button,select{background:rgba(8,18,23,.9);color:#cfe3e8;border:1px solid var(--line);border-radius:2px;padding:11px 14px;cursor:pointer;min-height:44px;font-size:11px;letter-spacing:.12em}button:hover,button:focus-visible{border-color:rgba(170,225,238,.55);color:#fff}button:active{transform:translateY(1px)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls>*{width:100%}.footer{text-align:center;color:#4e656d;font-size:8px;letter-spacing:.16em;padding-bottom:2px}
.modal{position:fixed;inset:0;background:rgba(0,3,5,.82);display:grid;place-items:center;padding:18px;z-index:100}.modal.hidden{display:none}.modal-card{width:min(520px,100%);padding:24px;border-radius:3px;background:#071117;border:1px solid rgba(130,205,220,.3);box-shadow:0 25px 80px rgba(0,0,0,.65)}.modal-card h2{margin:0 0 8px;font-weight:500;letter-spacing:.08em}.modal-card p{color:var(--muted);line-height:1.5;font-size:13px}.modal-card input{width:100%;padding:13px;border-radius:2px;border:1px solid var(--line);background:#02070a;color:white;font-size:16px;margin:8px 0 10px;outline:none}.modal-card a{color:var(--cyan)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.12)}}
@media(max-width:560px){.wrap{padding:11px}.core{height:36vh;min-height:245px}.chat{max-height:30vh}.controls{grid-template-columns:repeat(2,1fr)}.brand{font-size:17px}.inputbar{padding:7px}.inputbar button{padding:10px 11px}.core:before,.core:after{inset:10px}}
@media(max-width:380px){.inputbar{flex-wrap:wrap}.inputbar input{flex-basis:100%}.inputbar button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">J.A.R.V.I.S.</div><div id="status" class="status">OFFLINE</div></header>
<section class="panel core"><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><div class="core-stage"><div class="ring"></div><div class="ring2"></div><div class="ticks"></div><div class="scan"></div><div class="orb"></div></div><div class="core-label">PERSONAL INTELLIGENCE SYSTEM</div></section>
<section id="chat" class="panel chat" aria-live="polite"></section>
<div class="panel inputbar"><input id="input" autocomplete="off" placeholder="Speak or type to JARVIS…"><button id="send" type="button">SEND</button><button id="mic" type="button">MIC</button></div>
<div class="controls"><button id="connect" type="button">CONNECT</button><button id="loc" type="button">LOCATION</button><button id="reset" type="button">RESET MEMORY</button><select id="voice" aria-label="Voice"><option>Loading voices…</option></select></div>
<div class="footer">J.A.R.V.I.S. · BROWSER VOICE · GROQ INTELLIGENCE · LOCAL MEMORY</div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="connectTitle"><div class="modal-card"><h2 id="connectTitle">CONNECT J.A.R.V.I.S.</h2><p>Enter your Groq API key to enable AI responses. The key is kept only in this browser tab and is not written to local storage.</p><input id="key" type="password" placeholder="gsk_…" autocomplete="off"><button id="saveKey" type="button">CONNECT JARVIS</button><p>Get a key from <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq Console</a>.</p></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let apiKey='';const memoryKey='jarvis_memory_v1';let history=[];const persona='You are Jarvis, a warm, sharp, quietly witty personal AI assistant inspired by J.A.R.V.I.S. — poised, efficient, a little dry-humored, always addressing the user respectfully but never stiffly. Keep replies concise and conversational (2-4 sentences unless asked for more detail), since they will often be read aloud. Never invent current facts.';try{const saved=localStorage.getItem(memoryKey);if(saved){const x=JSON.parse(saved);if(Array.isArray(x.history))history=x.history}}catch(e){}function save(){try{localStorage.setItem(memoryKey,JSON.stringify({history:history.slice(-60)}))}catch(e){}}function addLine(who,text){const row=document.createElement('div');row.className='line '+(who==='YOU'?'user':'jarvis');const tag=document.createElement('div');tag.className='tag';tag.textContent=who;const msg=document.createElement('div');msg.className='msg';msg.textContent=text;row.append(tag,msg);$('chat').appendChild(row);$('chat').scrollTop=$('chat').scrollHeight}function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const selected=$('voice').value;const v=[...speechSynthesis.getVoices()].find(x=>x.name===selected);if(v)u.voice=v;u.rate=.96;u.pitch=.95;speechSynthesis.speak(u)}function loadVoices(){if(!('speechSynthesis'in window))return;const vs=speechSynthesis.getVoices(),sel=$('voice');sel.innerHTML='';const preferred=vs.filter(v=>/English/i.test(v.lang)).sort((a,b)=>{const score=x=>/Daniel|Arthur|Fred|male|UK/i.test(x.name)?1:0;return score(b)-score(a)});(preferred.length?preferred:vs).forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name;sel.appendChild(o)});if(!sel.options.length){const o=document.createElement('option');o.textContent='Browser voice unavailable';sel.appendChild(o)}}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function setStatus(t){$('status').textContent=t}function openModal(){$('modal').classList.remove('hidden');setTimeout(()=>$('key').focus(),0)}function closeModal(){$('modal').classList.add('hidden')}
function cleanKey(value){let k=String(value||'').trim();if((k.startsWith('"')&&k.endsWith('"'))||(k.startsWith("'")&&k.endsWith("'"))||(k.startsWith('`')&&k.endsWith('`')))k=k.slice(1,-1).trim();return k}
async function groqError(r){let detail='';try{const data=await r.json();detail=data?.error?.message||data?.message||''}catch(e){}if(r.status===401)return 'Groq rejected the API key (401). Check that the key is valid and was copied correctly.';if(r.status===403)return 'Groq denied access (403). Check the key permissions.';if(r.status===429)return 'Groq rate limit reached (429). Please try again later.';return detail||'Groq connection failed ('+r.status+').'}
async function connect(key){key=cleanKey(key);if(!key)throw new Error('Please enter your Groq API key.');setStatus('CONNECTING…');const r=await fetch('https://api.groq.com/openai/v1/models',{method:'GET',headers:{'Authorization':'Bearer '+key,'Accept':'application/json'}});if(!r.ok)throw new Error(await groqError(r));apiKey=key;setStatus('ONLINE');closeModal();addLine('JARVIS','Connection established. How may I assist?');speak('Connection established. How may I assist?')}
$('connect').addEventListener('click',openModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('saveKey').addEventListener('click',async()=>{const k=cleanKey($('key').value);if(!k)return;try{await connect(k)}catch(e){setStatus('ERROR');addLine('JARVIS',e.message)}});$('key').addEventListener('keydown',e=>{if(e.key==='Enter')$('saveKey').click()});async function ask(text){text=text.trim();if(!text)return;if(!apiKey){openModal();return}addLine('YOU',text);history.push({role:'user',content:text});save();setStatus('THINKING…');try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'groq/compound',messages:[{role:'system',content:persona},...history.slice(-30)],temperature:.7,max_tokens:500})});const data=await r.json();if(!r.ok)throw new Error(data?.error?.message||'JARVIS request failed');const reply=data.choices?.[0]?.message?.content||"I wasn't able to produce a response.";history.push({role:'assistant',content:reply});save();addLine('JARVIS',reply);speak(reply);setStatus('ONLINE')}catch(e){setStatus('ERROR');addLine('JARVIS',e.message)}}$('send').addEventListener('click',()=>{const x=$('input'),t=x.value;x.value='';ask(t)});$('input').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click()});const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;if(SR){rec=new SR();rec.continuous=false;rec.interimResults=false;rec.lang='en-US';rec.onstart=()=>setStatus('LISTENING…');rec.onresult=e=>{$('input').value=e.results[0][0].transcript;ask($('input').value);$('input').value=''};rec.onerror=e=>{setStatus(apiKey?'ONLINE':'OFFLINE');addLine('JARVIS','Voice input error: '+e.error)};rec.onend=()=>{if(apiKey)setStatus('ONLINE')};$('mic').addEventListener('click',()=>{try{rec.start()}catch(e){}})}else{$('mic').addEventListener('click',()=>addLine('JARVIS','Voice input is not supported by this browser.'))}$('reset').addEventListener('click',()=>{if(confirm('Clear JARVIS memory on this browser?')){history=[];localStorage.removeItem(memoryKey);$('chat').innerHTML='';addLine('JARVIS','Memory cleared.');speak('Memory cleared.')}});$('loc').addEventListener('click',()=>{if(!navigator.geolocation){addLine('JARVIS','Location is not available in this browser.');return}setStatus('LOCATING…');navigator.geolocation.getCurrentPosition(async p=>{try{const lat=p.coords.latitude,lon=p.coords.longitude,r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&temperature_unit=fahrenheit');if(!r.ok)throw new Error();const w=await r.json(),c=w.current,text='Current temperature: '+Math.round(c.temperature_2m)+'°F. Weather code: '+c.weather_code+'.';addLine('JARVIS',text);speak(text);setStatus(apiKey?'ONLINE':'OFFLINE')}catch(e){setStatus('ERROR');addLine('JARVIS',"I couldn't retrieve the weather right now.")}},()=>{setStatus(apiKey?'ONLINE':'OFFLINE');addLine('JARVIS','Location permission was unavailable.')},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})});for(const m of history.filter(x=>x&&(x.role==='user'||x.role==='assistant'))){addLine(m.role==='user'?'YOU':'JARVIS',String(m.content||''))}if(!history.length)addLine('JARVIS','Systems ready. Connect me to begin.');})();
</script>
</body>
</html>
