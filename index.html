<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a0f">
<title>J.A.R.V.I.S.</title>
<style>
:root{--bg:#050a0f;--panel:rgba(8,18,27,.88);--line:rgba(87,220,255,.28);--cyan:#57dcff;--text:#e8fbff;--muted:#80a8b5;--amber:#ffc857;}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 18%,#102b3a 0,#07131d 38%,#020509 78%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh}.wrap{width:min(980px,100%);min-height:100dvh;margin:auto;padding:18px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{letter-spacing:.2em;font-weight:800;font-size:clamp(18px,4vw,28px)}.status{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 0 40px rgba(0,180,255,.08);backdrop-filter:blur(14px)}.core{min-height:290px;display:grid;place-items:center;position:relative;overflow:hidden}.core-stage{width:min(390px,62vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative}.ring,.ring:before,.ring:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(87,220,255,.34)}.ring{inset:0;animation:spin 14s linear infinite}.ring:before{inset:10%;border-color:rgba(255,200,87,.4);animation:spin 8s linear reverse infinite}.ring:after{inset:22%;border-style:dashed;border-color:rgba(87,220,255,.55);animation:spin 5s linear infinite}.orb{width:38%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#e9fdff 0 5%,#57dcff 12%,#168fb0 35%,rgba(13,91,112,.35) 58%,transparent 70%);box-shadow:0 0 24px #57dcff,0 0 80px rgba(87,220,255,.42);animation:pulse 2.4s ease-in-out infinite}.scan{position:absolute;inset:5%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 72%,rgba(87,220,255,.45) 78%,transparent 84%);animation:spin 3s linear infinite}.chat{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:44vh;overflow:auto}.line{display:flex;gap:10px}.tag{flex:0 0 auto;color:var(--cyan);font-size:10px;letter-spacing:.14em;padding-top:3px}.msg{line-height:1.5;white-space:pre-wrap;word-break:break-word}.user .tag{color:var(--amber)}.inputbar{display:flex;gap:8px;padding:10px}.inputbar input{flex:1;min-width:0;background:#061018;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:13px 14px;font-size:16px;outline:none}.inputbar input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(87,220,255,.08)}button,select{background:#081722;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;cursor:pointer}button:hover{border-color:var(--cyan)}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls>*{flex:1 1 auto}.mic{min-width:72px}.footer{text-align:center;color:#5f808b;font-size:10px;letter-spacing:.1em;padding-bottom:4px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px;z-index:10}.modal.hidden{display:none}.modal-card{width:min(520px,100%);padding:22px;border-radius:20px;background:#07131c;border:1px solid var(--line)}.modal-card h2{margin:0 0 8px}.modal-card p{color:var(--muted);line-height:1.5;font-size:14px}.modal-card input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#03090e;color:white;font-size:16px;margin:8px 0 10px}.modal-card a{color:var(--cyan)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.2)}}@media(max-width:480px){.wrap{padding:12px}.core{min-height:245px}.core-stage{width:68vw}.chat{max-height:38vh}.controls button,.controls select{padding:10px 9px;font-size:13px}.brand{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">J.A.R.V.I.S.</div><div id="status" class="status">OFFLINE</div></header>
  <section class="panel core"><div class="core-stage"><div class="ring"></div><div class="scan"></div><div class="orb"></div></div></section>
  <section id="chat" class="panel chat"></section>
  <div class="panel inputbar"><input id="input" autocomplete="off" placeholder="Speak or type to JARVIS…"><button id="send">SEND</button><button id="mic" class="mic">MIC</button></div>
  <div class="controls">
    <button id="connect">CONNECT</button><button id="loc">LOCATION</button><button id="reset">RESET MEMORY</button>
    <select id="voice" aria-label="Voice"><option>Loading voices…</option></select>
  </div>
  <div class="footer">VOICE VIA BROWSER SPEECH SYNTHESIS · GROQ MODEL · MEMORY SAVED LOCALLY IN THIS BROWSER</div>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><h2>Connect J.A.R.V.I.S.</h2><p>Enter your Groq API key to enable AI responses. The key is kept only in this browser tab and is not written to local storage.</p><input id="key" type="password" placeholder="gsk_…" autocomplete="off"><button id="saveKey">CONNECT JARVIS</button><p>Get a key from <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq Console</a>.</p></div></div>
<script>
const $=id=>document.getElementById(id);
let apiKey="";
const memoryKey="jarvis_memory_v1";
let history=[];
const persona=`You are Jarvis, a warm, sharp, quietly witty personal AI assistant inspired by J.A.R.V.I.S. — poised, efficient, a little dry-humored, always addressing the user respectfully but never stiffly. Keep replies concise and conversational (2-4 sentences unless asked for more detail), since they will often be read aloud. You can use live web information when the connected model supports it; never invent current facts.`;
const saved=localStorage.getItem(memoryKey);if(saved){try{const x=JSON.parse(saved);history=x.history||[];}};
function save(){localStorage.setItem(memoryKey,JSON.stringify({history:history.slice(-60)}));}
function addLine(who,text){const row=document.createElement("div");row.className="line "+(who==="YOU"?"user":"jarvis");const tag=document.createElement("div");tag.className="tag";tag.textContent=who;const msg=document.createElement("div");msg.className="msg";msg.textContent=text;row.append(tag,msg);$("chat").appendChild(row);$("chat").scrollTop=$("chat").scrollHeight;}
function speak(text){if(!("speechSynthesis" in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const selected=$("voice").value;const v=[...speechSynthesis.getVoices()].find(x=>x.name===selected);if(v)u.voice=v;u.rate=.96;u.pitch=.95;u.onend=()=>{};speechSynthesis.speak(u);}
function loadVoices(){const vs=speechSynthesis.getVoices();const sel=$("voice");sel.innerHTML="";const preferred=vs.filter(v=>/English/i.test(v.lang)).sort((a,b)=>{const score=x=>/Daniel|Arthur|Fred|male|UK/i.test(x.name)?1:0;return score(b)-score(a)});(preferred.length?preferred:vs).forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name;sel.appendChild(o)});}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function setStatus(t){$("status").textContent=t}
async function connect(key){setStatus("CONNECTING…");const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:"ping"}],max_tokens:5})});if(!r.ok)throw new Error("Connection failed ("+r.status+")");apiKey=key;setStatus("ONLINE");$("modal").classList.add("hidden");addLine("JARVIS","Connection established. How may I assist?");speak("Connection established. How may I assist?");}
$("connect").onclick=()=>$("modal").classList.remove("hidden");$("saveKey").onclick=async()=>{const k=$("key").value.trim();if(!k)return;try{await connect(k)}catch(e){setStatus("ERROR");addLine("JARVIS",e.message)}};
async function ask(text){if(!text.trim())return;if(!apiKey){$("modal").classList.remove("hidden");$("key").focus();return}addLine("YOU",text);history.push({role:"user",content:text});save();setStatus("THINKING…");try{const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+apiKey},body:JSON.stringify({model:"groq/compound",messages:[{role:"system",content:persona},...history.slice(-30)],temperature:.7,max_tokens:500})});const data=await r.json();if(!r.ok)throw new Error(data?.error?.message||"JARVIS request failed");const reply=data.choices?.[0]?.message?.content||"I wasn't able to produce a response.";history.push({role:"assistant",content:reply});save();addLine("JARVIS",reply);speak(reply);setStatus("ONLINE")}catch(e){setStatus("ERROR");addLine("JARVIS",e.message)}}
$("send").onclick=()=>{const x=$("input");const t=x.value;x.value="";ask(t)};$("input").addEventListener("keydown",e=>{if(e.key==="Enter")$("send").click()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;if(SR){rec=new SR();rec.continuous=false;rec.interimResults=false;rec.lang="en-US";rec.onstart=()=>setStatus("LISTENING…");rec.onresult=e=>{const t=e.results[0][0].transcript;$("input").value=t;ask(t)};rec.onerror=e=>{setStatus("ONLINE");addLine("JARVIS","Voice input error: "+e.error)};rec.onend=()=>{if(apiKey)setStatus("ONLINE")};$("mic").onclick=()=>{try{rec.start()}catch(e){}}}else $("mic").onclick=()=>addLine("JARVIS","Voice input is not supported by this browser.");
$("reset").onclick=()=>{if(confirm("Clear JARVIS memory on this browser?")){history=[];localStorage.removeItem(memoryKey);$("chat").innerHTML="";addLine("JARVIS","Memory cleared.");speak("Memory cleared.")}};
$("loc").onclick=()=>{if(!navigator.geolocation)return addLine("JARVIS","Location is not available in this browser.");setStatus("LOCATING…");navigator.geolocation.getCurrentPosition(async p=>{try{const lat=p.coords.latitude,lon=p.coords.longitude;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`);const w=await r.json();const c=w.current;const text=`Current temperature: ${Math.round(c.temperature_2m)}°F. Weather code: ${c.weather_code}.`;addLine("JARVIS",text);speak(text);setStatus(apiKey?"ONLINE":"OFFLINE")}catch(e){setStatus("ERROR");addLine("JARVIS","I couldn't retrieve the weather right now.")}},()=>{setStatus(apiKey?"ONLINE":"OFFLINE");addLine("JARVIS","Location permission was unavailable.")},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})};
for(const m of history.filter(x=>x.role==="user"||x.role==="assistant"))addLine(x.role==="user"?"YOU":"JARVIS",m.content);if(!history.length)addLine("JARVIS","Systems ready. Connect me to begin.");
</script>
</body>
</html>
